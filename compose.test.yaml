# Complete test pipeline in Docker, identical to CI:
#   docker compose -f compose.test.yaml run --rm --build test
name: openplancraft-test

services:
  test:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: test
      secrets: [extra_ca]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://test:test@db:5432/test
      # Real KoSIT validator: e-invoice tests check the generated XML against it (rule 8).
      KOSIT_URL: http://kosit:8080
      # Real RustFS with Object Lock (ADR 0009). Root key: the tests create their own buckets;
      # the app's restricted key (storage-setup) is tested with ARCHIVE_APP_*.
      ARCHIVE_S3_ENDPOINT: http://storage:9000
      ARCHIVE_S3_ACCESS_KEY: archiv-root
      ARCHIVE_S3_SECRET_KEY: archiv-test-root-secret
      ARCHIVE_APP_ENDPOINT: http://storage:9000
      ARCHIVE_APP_ACCESS_KEY: archiv-app
      ARCHIVE_APP_SECRET_KEY: archiv-app-test-secret
      ARCHIVE_APP_BUCKET: belegarchiv
    depends_on:
      db:
        condition: service_healthy
      kosit:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully

  # Belegarchiv as in the stack (ADR 0009): RustFS, fixed test keys instead of the keys volume.
  storage:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: archiv-root
      RUSTFS_SECRET_KEY: archiv-test-root-secret
      RUSTFS_OBS_LOG_DIRECTORY: ""
    tmpfs: ["/data:uid=10001,mode=0700", /tmp]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30

  storage-setup:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    entrypoint: ["sh", "/opt/storage/setup.sh"]
    environment:
      STORAGE_ROOT_USER: archiv-root
      STORAGE_ROOT_SECRET: archiv-test-root-secret
      ARCHIVE_S3_ACCESS_KEY: archiv-app
      ARCHIVE_S3_SECRET_KEY: archiv-app-test-secret
    tmpfs: [/tmp]
    volumes:
      - ./infra/storage:/opt/storage:ro
    depends_on:
      storage:
        condition: service_healthy

  kosit:
    build:
      context: .
      dockerfile: docker/kosit.Dockerfile
    read_only: true
    tmpfs: [/tmp]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 2s
      retries: 30

secrets:
  # Optional CA certificate for TLS-inspecting proxies during image builds (see .env.example).
  extra_ca:
    file: ${EXTRA_CA_CERT:-./docker/no-extra-ca.pem}
