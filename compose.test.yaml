# Complete test pipeline in Docker, identical to CI:
#   docker compose -f compose.test.yaml run --rm --build test
name: openplancraft-test

services:
  test:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: test
      secrets: [extra_ca]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://test:test@db:5432/test
      # Real KoSIT validator: e-invoice tests check the generated XML against it (rule 8).
      KOSIT_URL: http://kosit:8080
      # Real MinIO with Object Lock: archive tests write WORM objects (ADR 0008).
      ARCHIVE_S3_ENDPOINT: http://storage:9000
      ARCHIVE_S3_ACCESS_KEY: archiv
      ARCHIVE_S3_SECRET_KEY: archiv-test-secret
    depends_on:
      db:
        condition: service_healthy
      kosit:
        condition: service_healthy
      storage:
        condition: service_healthy

  storage:
    build:
      context: .
      dockerfile: docker/storage.Dockerfile
      secrets: [extra_ca]
    environment:
      MINIO_ROOT_USER: archiv
      MINIO_ROOT_PASSWORD: archiv-test-secret
    # MinIO runs as an unprivileged user (uid 10001).
    tmpfs: ["/data:uid=10001,mode=0700", /tmp]

  kosit:
    build:
      context: .
      dockerfile: docker/kosit.Dockerfile
    read_only: true
    tmpfs: [/tmp]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 2s
      retries: 30

secrets:
  # Optional CA certificate for TLS-inspecting proxies during image builds (see .env.example).
  extra_ca:
    file: ${EXTRA_CA_CERT:-./docker/no-extra-ca.pem}
